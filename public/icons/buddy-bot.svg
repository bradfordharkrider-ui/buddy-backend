<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FB6A6"/>
      <stop offset="100%" stop-color="#4C5FD5"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F3FF"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- antenna -->
  <line x1="256" y1="122" x2="256" y2="90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="80" r="16" fill="#FFD166" stroke="#FFFFFF" stroke-width="4"/>

  <!-- ears -->
  <rect x="122" y="196" width="30" height="60" rx="15" fill="#FFFFFF"/>
  <rect x="360" y="196" width="30" height="60" rx="15" fill="#FFFFFF"/>

  <!-- head -->
  <rect x="140" y="130" width="232" height="196" rx="56" fill="url(#face)"/>

  <!-- eyes -->
  <rect x="192" y="200" width="46" height="54" rx="22" fill="#33406B"/>
  <rect x="274" y="200" width="46" height="54" rx="22" fill="#33406B"/>
  <circle cx="207" cy="214" r="7" fill="#FFFFFF"/>
  <circle cx="289" cy="214" r="7" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M214 278 Q256 306 298 278" stroke="#33406B" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- neck -->
  <rect x="226" y="326" width="60" height="24" fill="#F0F3FF"/>

  <!-- body / torso (rounded, tidy) -->
  <rect x="164" y="350" width="184" height="118" rx="40" fill="#FFFFFF"/>

  <!-- bowtie: friendly "at your service" cue -->
  <path d="M256 356 L226 340 L226 372 Z" fill="#FFD166"/>
  <path d="M256 356 L286 340 L286 372 Z" fill="#FFD166"/>
  <circle cx="256" cy="356" r="10" fill="#4C5FD5"/>

  <!-- tidy checklist marks on torso: "organized" cue -->
  <g stroke="#9AA6D6" stroke-width="8" stroke-linecap="round">
    <line x1="196" y1="404" x2="316" y2="404"/>
    <line x1="196" y1="428" x2="286" y2="428"/>
  </g>
</svg>
